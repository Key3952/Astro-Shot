name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Restore or generate debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Ensure debug.keystore exists in both root and app directory
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          ls -la debug.keystore

      - name: Generate upload keystore for release
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating my-upload-key.jks..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=AstroShot, OU=Android, O=Astro, L=City, S=State, C=US"
          fi
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Collect and Rename APKs
        run: |
          mkdir -p output_apks
          # Find and copy Debug APK
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apks/AstroShot-debug.apk
          else
            find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output_apks/AstroShot-debug.apk \; 2>/dev/null || true
          fi

          # Find and copy Release APK (signed or unsigned fallback)
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output_apks/AstroShot-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output_apks/AstroShot-release.apk
          else
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} output_apks/AstroShot-release.apk \; 2>/dev/null || true
          fi
          echo "Collected APK files for Release:"
          ls -lh output_apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroShot-debug-apk
          path: output_apks/AstroShot-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroShot-release-apk
          path: output_apks/AstroShot-release.apk
          if-no-files-found: warn

      - name: Create GitHub Release with Standalone APKs
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: |
            output_apks/AstroShot-debug.apk
            output_apks/AstroShot-release.apk
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

